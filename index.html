<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f15;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .search-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .search-container input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 6px;
            color: #24292e;
            background: transparent;
        }

        .search-container button {
            background-color: #1f6feb;
            color: white;
            border: none;
            outline: none;
            padding: 10px 26px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-container button:hover {
            background-color: #388bfd;
        }

        .result-card {
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }

        .result-card.success {
            background-color: #0d1b11;
            border: 1px solid #238636;
        }

        .result-card.danger {
            background-color: #261214;
            border: 1px solid #da3633;
        }

        .result-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .result-card.success h3 {
            color: #3fb950;
        }

        .result-card.danger h3 {
            color: #f85149;
        }

        .result-card p {
            color: #c9d1d9;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Password Checking 🔐</h1>
        
        <div class="search-container">
            <input type="password" id="passwordInput" placeholder="Enter password to check live...">
            <button onclick="checkPasswordLive()">Check</button>
        </div>

        <div id="passwordResult"></div>
    </div>

    <script>
        async function sha1(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-1', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        async function checkPasswordLive() {
            const pwd = document.getElementById('passwordInput').value;
            const resultDiv = document.getElementById('passwordResult');

            if (!pwd) {
                resultDiv.innerHTML = `<div class="result-card danger"><h3>Error</h3><p>Please enter a password first!</p></div>`;
                return;
            }

            resultDiv.innerHTML = `<p style="color:#8b949e;">Checking live database securely...</p>`;

            try {
                const hash = await sha1(pwd);
                const prefix = hash.slice(0, 5);
                const suffix = hash.slice(5);

                const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
                if (!response.ok) throw new Error('Network error');

                const text = await response.text();
                const lines = text.split('\n');
                
                let foundCount = 0;
                for (let line of lines) {
                    const [hashSuffix, count] = line.split(':');
                    if (hashSuffix.trim() === suffix) {
                        foundCount = parseInt(count, 10);
                        break;
                    }
                }

                if (foundCount > 0) {
                    resultDiv.innerHTML = `
                        <div class="result-card danger">
                            <h3>Password Bhut Week Hai !</h3>
                            <p>Password Itni Baar <strong>${foundCount.toLocaleString()}</strong> Used Ho Chuka Hai</p>
                        </div>`;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result-card success">
                            <h3>Very Very Good No used Password</h3>
                            <p>Ye Password Aapke Liye Better Hai ⚡</p>
                        </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result-card danger"><h3>Connection Error</h3><p>Could not check live database. Try again.</p></div>`;
            }
        }
    </script>

</body>
</html>
